<!doctype html>
<html>
<head>
    <title>Book Appliance Repair Appointment</title>
</head>
<body>
    <h1>Book an Appointment</h1>
    <form action="/book" method="post">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br>

        <label for="phone">Phone:</label><br>
        <input type="text" id="phone" name="phone" required><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br>

        <label for="date">Preferred Date:</label><br>
        <input type="date" id="date" name="date" required><br>

        <label for="time">Preferred Time:</label><br>
        <input type="time" id="time" name="time" required><br>

        <label for="service">Service Needed:</label><br>
        <input type="text" id="service" name="service" required><br><br>

        <button type="submit">Book Appointment</button>
    </form>
</body>
</html>
